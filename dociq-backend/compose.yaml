# ═══════════════════════════════════════════════════════
# DocIQ — Dev Infrastructure
# ═══════════════════════════════════════════════════════
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v   (wipes all data)
# Logs:   docker compose logs -f postgres
# Env:    copy .env.example → .env and edit before first run
# ═══════════════════════════════════════════════════════

services:

  postgres:
    image: postgres:16-alpine
    container_name: dociq-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dociq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dociq_pgdata:/var/lib/postgresql/data
    networks:
      - dociq-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dociq}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: dociq-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - dociq_qdrant:/qdrant/storage
    networks:
      - dociq-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  dociq-net:
    name: dociq-net
    driver: bridge

volumes:
  dociq_pgdata:
  dociq_qdrant:
