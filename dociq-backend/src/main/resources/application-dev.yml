# ═══════════════════════════════════════════════════════
# DocIQ — DEV Profile (activate with: --spring.profiles.active=dev)
# ═══════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false

logging:
  level:
    com.dociq: DEBUG
    org.hibernate.SQL: WARN

dociq:
  ai:
    provider: mock              # Zero API cost during development

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /api-docs