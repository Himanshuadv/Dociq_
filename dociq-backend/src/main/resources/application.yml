# ═══════════════════════════════════════════════════════
# DocIQ Backend — Base Configuration
# ═══════════════════════════════════════════════════════
spring:
  application:
    name: dociq-backend

  # ── Database ──────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/dociq?currentSchema=public
    username: postgres
    password: PostGre73@1
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ───────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update       # Flyway controls schema; Hibernate ONLY validates
    show-sql: false
    open-in-view: false         # IMPORTANT: prevents lazy loading issues
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50

  # ── Flyway Migrations ─────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ── File Upload ───────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 22MB
      file-size-threshold: 2KB

  # ── Jackson (JSON) ────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: NON_NULL

  # ── Cache (disabled in v1, enable Redis in v2) ────────
  cache:
    type: none

# ═══════════════════════════════════════════════════════
# Server
# ═══════════════════════════════════════════════════════
server:
  port: 8080
  error:
    include-message: always      # Never expose stack traces to clients
    include-binding-errors: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /api-docs

# ═══════════════════════════════════════════════════════
# Actuator (Health + Metrics)
# ═══════════════════════════════════════════════════════
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ═══════════════════════════════════════════════════════
# Logging
# ═══════════════════════════════════════════════════════
logging:
  level:
    com.dociq: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ═══════════════════════════════════════════════════════
# DocIQ Custom Properties
# ═══════════════════════════════════════════════════════
dociq:
  jwt:
    secret: ${JWT_SECRET:ThisIsADevSecretKeyThatMustBeAtLeast32Chars}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7

  storage:
    type: local
    local:
      base-path: ${STORAGE_PATH:./uploads}

  jobs:
    max-attempts: ${DOCIQ_JOBS_MAX_ATTEMPTS:3}
    batch-size: ${DOCIQ_JOBS_BATCH_SIZE:5}
  job:
    max-attempts: ${DOCIQ_JOBS_MAX_ATTEMPTS:3}
    batch-size: ${DOCIQ_JOBS_BATCH_SIZE:5}

  ai:
    provider: mock              # mock | openai | groq
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding-model: text-embedding-3-small
      chat-model: gpt-4o-mini
      max-tokens: 2000
    groq:
      api-key: ${GROQ_API_KEY:}
      chat-model: llama-3.3-70b-versatile

  qdrant:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_PORT:6333}
    collection-name: dociq_chunks
    vector-dimensions: 1536

  worker:
    poll-interval-ms: 5000
    max-concurrent-jobs: 2
    enabled: true

  chunking:
    strategy: fixed
    target-token-size: 512
    overlap-tokens: 64